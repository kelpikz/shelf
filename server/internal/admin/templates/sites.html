{{define "title"}}Sites{{end}}

{{define "content"}}
<header class="topbar">
  <div class="brand">{{template "logo"}}<span>shelf</span><span class="tag">Admin</span></div>
  <div class="who">
    {{with .Session.AvatarURL}}<img class="avatar" src="{{.}}" alt="" width="28" height="28">{{end}}
    <span>@{{.Session.Login}}</span>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{.Session.CSRF}}">
      <button class="btn btn-ghost btn-small" type="submit">Log out</button>
    </form>
  </div>
</header>

<main class="page">
  <h1>Sites</h1>
  <section class="card empty">
    {{template "logo"}}
    <h2>No Sites yet</h2>
    <p class="muted">Upload one with the CLI:</p>
    <code>shelf upload &lt;folder&gt; &lt;path&gt;</code>
  </section>
</main>
{{end}}
