{{define "title"}}Thanks{{end}}

{{define "content"}}
<main class="center">
  <section class="card login">
    <div class="brand">{{template "logo"}}<span>shelf</span></div>
    <h1>Thanks for stopping by</h1>
    <p class="muted">You logged in as <strong>@{{.Login}}</strong>, but this shelf has only one Owner. We saved nothing about you.</p>
    <a class="btn btn-ghost" href="/login">Back</a>
  </section>
</main>
{{end}}
