[package]
name = "shelf"
version = "0.1.0"
edition = "2024"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
gethostname = "1.1.0"
keyring = "4.2.0"
open = "5.4.5"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
